services:
  # Backend FastAPI Service
  - type: web
    name: dev-telemetry-api
    env: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health   # 200 when the database is reachable; Render restarts the service otherwise
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Optional: GEMINI_MODEL (default gemini-3.8-flash) and GEMINI_FALLBACK_MODEL
      # (default gemini-3.5-flash-lite, used on quota/overload; empty = off).
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Required for admin actions (save schedule, send alerts). Unset = those actions are disabled.
      - key: ADMIN_TOKEN
        sync: false
      # Demo data uses synthetic @example.com addresses: keep every email routed to EMAIL_RECIPIENT.
      - key: PRODUCTION_MODE
        value: "false"
    # Storage: the free tier has an ephemeral filesystem, so the SQLite DB (DB_PATH, set in
    # Dockerfile.backend) starts empty on every deploy/restart and is seeded at container start.
    # Saved schedules and dispatch history reset too. For persistence, attach a Render disk at
    # /app/db (paid) -- the start command only seeds an empty database.
    # Scheduled alerts are triggered by .github/workflows/scheduled-alerts.yml (needs ADMIN_TOKEN).

  # Frontend React Service
  - type: web
    name: dev-telemetry-dashboard
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # The backend's public URL (e.g. https://dev-telemetry-api.onrender.com). Vite bakes it in
      # at BUILD time: without it the dashboard calls http://127.0.0.1:8000, the visitor's machine.
      - key: VITE_API_URL
        sync: false
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
