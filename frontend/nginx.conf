# Serves the built dashboard. React Router handles /engineer/... and /runbook/... in the
# browser, so any path that isn't a real file gets index.html (nginx's default config
# answered 404, which broke the runbook links in alert emails).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
