# Project lint rules. CI and local runs both use this file, so a personal/global ruff config
# can't make "passes on my machine" differ from CI.
target-version = "py313"  # matches Dockerfile.backend and CI
extend-exclude = ["venv", "frontend"]

[lint]
# pyflakes (F), serious pycodestyle errors (E4/E7/E9), bugbear (B: likely bugs) and no print() (T20).
# Style-only rule sets (import order, quotes) are intentionally off: noise without bug-finding value.
select = ["E4", "E7", "E9", "F", "B", "T20"]

[lint.per-file-ignores]
# Server code must log; these command-line tools print because their output is the interface.
"main.py" = ["T20"]
"data/seed.py" = ["T20"]
"data/clock.py" = ["T20"]
"tests/*" = ["T20"]
