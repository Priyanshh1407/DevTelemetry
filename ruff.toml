# Project lint rules. CI and local runs both use this file, so a personal/global ruff config
# can't make "passes on my machine" differ from CI.
target-version = "py310"  # matches Dockerfile.backend and CI
extend-exclude = ["venv", "frontend"]

[lint]
# pyflakes (F), serious pycodestyle errors (E4/E7/E9) and bugbear (B: likely bugs).
# Style-only rule sets (import order, quotes) are intentionally off: noise without bug-finding value.
select = ["E4", "E7", "E9", "F", "B"]
